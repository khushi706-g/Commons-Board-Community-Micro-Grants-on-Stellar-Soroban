[workspace]
resolver = "2"
members = [
    "contracts/bounty",
    "contracts/contributor",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
